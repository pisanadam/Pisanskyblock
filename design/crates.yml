  - id: ejder
    name: "Ejder Sandığı"
    tier: 8
    rewards: ["Büyük kitaplar: Sharpness VI, Efficiency VI, Fortune IV, Protection V (oyunda normalde yok)", "Beacon", "Elytra"]
  - id: efsane
    name: "Efsane Sandığı"
    tier: 9
    rewards: ["En yüksek seviye kitaplar", "Netherite template (çok düşük şans)", "Ender Dragon Head/Nadir koleksiyon", "Çok büyük coin paketi"]
