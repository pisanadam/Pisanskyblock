  - id: madenci
    name: "Madenci Sandığı"
    tier: 3
    rewards: ["Elmas (birkaç adet)", "Lapis/Redstone paketleri", "Fortune II-III", "Yiyecek paketleri"]
  - id: demirci
    name: "Demirci Sandığı"
