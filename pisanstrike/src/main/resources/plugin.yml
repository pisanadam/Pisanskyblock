name: PisanStrike
version: 1.5.0
main: tr.pisan.strike.StrikePlugin
api-version: '1.20'
description: CS2 tarzi oyun - silahlar, bomba, market, parti, harita secimi, 1v1 ve olum maci. Mod gerektirmez.
author: Pisan
commands:
  parti:
    description: Parti menusu ve komutlari
    usage: /parti [kur|davet <oyuncu>|kabul <lider>|ayril|baslat]
  market:
    description: Silah marketi
  strikeadmin:
    description: Admin - test icin silah ver
    permission: pisanstrike.admin
  hizli:
    description: Hizli mac (derecesiz) 1v1-5v5 kuyrugu
    usage: /hizli [1v1|2v2|3v3|4v4|5v5|ayril]
    aliases: [hizlimac, quick]
  botstrike:
    description: Secilen derecesiz modu botlarla oyna (zorluk secilebilir)
    aliases: [botlar, bot]
  dereceli:
    description: Dereceli 1v1-5v5 kuyrugu, ELO ve siralama
    usage: /dereceli [1v1|2v2|3v3|4v4|5v5|ayril|sira]
    aliases: [ranked, rank]
  ayril:
    description: Mactan cik, lobiye don
    aliases: [lobi, leave]
permissions:
  pisanstrike.admin:
    default: op
