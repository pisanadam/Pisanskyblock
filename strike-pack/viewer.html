<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Yerlesim: solda silah rafi, ortada 3B sahne, sahnenin altinda/yaninda teknik kart. */
:root{
  --bg:#eef0ee; --panel:#ffffff; --stage:#dfe3df; --line:#c9cfc9; --fg:#1d221f; --muted:#5d6760;
  --accent:#d9741e; --t:#c4791c; --ct:#2f74b5; --chip:#e6e9e6; --grid:#b9c0b9;
  --display:"Chakra Petch",ui-sans-serif,system-ui,sans-serif; --body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141715; --panel:#1c201d; --stage:#202521; --line:#2f3631; --fg:#e7ebe7; --muted:#97a19a;
  --accent:#ef8a33; --t:#e09a3c; --ct:#5aa0e0; --chip:#262b27; --grid:#3a423c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141715; --panel:#1c201d; --stage:#202521; --line:#2f3631; --fg:#e7ebe7; --muted:#97a19a;
  --accent:#ef8a33; --t:#e09a3c; --ct:#5aa0e0; --chip:#262b27; --grid:#3a423c; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.app{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;max-width:1280px;margin:0 auto;min-height:calc(100% - 0px)}
header.top{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
h1{font-family:var(--display);font-weight:700;font-size:1.6rem;letter-spacing:.02em;margin:0;text-wrap:balance}
h1 span{color:var(--accent)}
.sub{color:var(--muted);margin:0}
aside{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0;max-height:calc(100vh - 110px);overflow:auto}
.search{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg);font:inherit}
.search:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.group h2{font-family:var(--display);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:6px 0 4px}
.list{display:flex;flex-direction:column;gap:2px}
.item{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;color:var(--fg);
  padding:6px 8px;border-radius:4px;font:inherit;cursor:pointer}
.item:hover{background:var(--chip)}
.item[aria-current="true"]{background:var(--chip);box-shadow:inset 3px 0 0 var(--accent)}
.item small{font-family:var(--mono);color:var(--muted);font-size:.75rem;font-variant-numeric:tabular-nums}
main{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;min-width:0}
.stagewrap{position:relative;background:var(--stage);border:1px solid var(--line);border-radius:6px;min-height:420px;overflow:hidden}
canvas#c{display:block;width:100%;height:100%;min-height:420px;touch-action:none}
.toolbar{position:absolute;left:10px;top:10px;display:flex;flex-wrap:wrap;gap:6px}
.toolbar button,.seg button{font:500 .8rem var(--body);border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:5px 10px;border-radius:4px;cursor:pointer}
.toolbar button[aria-pressed="true"],.seg button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.hint{position:absolute;right:10px;bottom:8px;color:var(--muted);font-size:.75rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card .kind{font-family:var(--display);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.card h3{font-family:var(--display);font-size:1.6rem;margin:0;line-height:1.1}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid currentColor}
.pill.t{color:var(--t)} .pill.ct{color:var(--ct)} .pill.any{color:var(--muted)} .pill.f{color:var(--fg)}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0}
dt{color:var(--muted)} dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.bar{grid-column:1/-1;height:4px;background:var(--chip);border-radius:2px;overflow:hidden;margin-top:-2px}
.bar i{display:block;height:100%;background:var(--accent)}
.meta{border-top:1px solid var(--line);padding-top:10px;font-family:var(--mono);font-size:.75rem;color:var(--muted);display:flex;flex-direction:column;gap:2px;word-break:break-all}
@media (max-width:900px){.app{grid-template-columns:1fr} aside{max-height:none} main{grid-template-columns:1fr} .list{flex-direction:row;flex-wrap:wrap} .item{width:auto;grid-template-columns:auto} .item small{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <h1>Pisan Strike <span>Cephanelik</span></h1>

  <aside aria-label="Silah listesi">

      <div class="hint" id="hint"></div>
    </div>
    <section class="card" id="card" aria-live="polite"></section>
  </main>
</div>

5.5,10.5,6.4,6.6,10.8,7.2,14],[5.5,10.5,7.6,6.6,10.8,8.4,14],[5.5,10.5,8.8,6.6,10.8,9.6,14],[7.3,10.5,6.4,8.4,10.8,7.2,14],[7.3,10.5,7.6,8.4,10.8,8.4,14],[7.3,10.5,8.8,8.4,10.8,9.6,14],[9.1,10.5,6.4,10.2,10.8,7.2,14],[9.1,10.5,7.6,10.2,10.8,8.4,14],[9.1,10.5,8.8,10.2,10.8,9.6,14],[9.8,10.5,6.2,10.8,10.9,7.2,11],[3.0,6.1,3.4,13.0,6.7,4,11],[3.0,7.7,3.4,13.0,8.3,4,13]],"name":"C4","kind":"BOMB","side":"T","price":0}]};
const KINDS = [["PISTOL","Tabancalar"],["SMG","Hafif makineli"],["RIFLE","Tüfekler"],["SNIPER","Keskin nişancı"],["SHOTGUN","Pompalılar"],["HEAVY","Ağır makineli"],["KNIFE","Yakın dövüş"],["GRENADE","Bombalar"],["TASER","Ekipman"],["GEAR","Ekipman"],["BOMB","Ekipman"]];
const KIND_NAME = Object.fromEntries(KINDS);
const SIDE = {T:["Terörist","t"],CT:["Anti-Terörist","ct"],ANY:["İki takım","any"]};
const ITEM_TR = {crossbow:"arbalet",iron_sword:"demir kılıç",shears:"makas",lightning_rod:"paratoner",firework_star:"havai fişek yıldızı",glowstone_dust:"ışıktaşı tozu",light_gray_dye:"açık gri boya",fire_charge:"ateş topu",blaze_powder:"alaz tozu",tnt_minecart:"TNT'li vagon"};
const byId = Object.fromEntries(DATA.models.map(m => [m.id, m]));
const maxOf = k => Math.max(...DATA.models.map(m => m[k] || 0));
const MAX = {dmg:maxOf("dmg"), rpm:maxOf("rpm"), price:maxOf("price"), mag:maxOf("mag")};

/* ---------- liste ---------- */
const groupsEl = document.getElementById("groups");
function renderList(filter){
  groupsEl.innerHTML = "";
  const seen = new Set();
  for (const [kind, label] of KINDS){
    if (seen.has(label)) continue; seen.add(label);
    const kinds = KINDS.filter(k => k[1] === label).map(k => k[0]);
    const items = DATA.models.filter(m => kinds.includes(m.kind) && (!filter || (m.name + " " + m.id).toLowerCase().includes(filter)));
    if (!items.length) continue;
    const g = document.createElement("div"); g.className = "group";
    g.innerHTML = `<h2>${label}</h2>`;
    const l = document.createElement("div"); l.className = "list";
    for (const m of items){
      const b = document.createElement("button"); b.className = "item"; b.dataset.id = m.id;
      b.innerHTML = `<span>${m.name}</span><small>${m.price ? "$" + m.price : "Ücretsiz"}</small>`;
      b.setAttribute("aria-current", m.id === current ? "true" : "false");
      b.addEventListener("click", () => { location.hash = m.id; });
      l.appendChild(b);
    }
    g.appendChild(l); groupsEl.appendChild(g);
  }
}
document.getElementById("q").addEventListener("input", e => renderList(e.target.value.trim().toLowerCase()));

/* ---------- kart ---------- */
function stat(label, val, frac){ return `<dt>${label}</dt><dd>${val}</dd>` + (frac != null ? `<div class="bar"><i style="width:${Math.round(Math.min(1,frac)*100)}%"></i></div>` : ""); }
function renderCard(m){
  const s = SIDE[m.side] || SIDE.ANY;
  const pills = [`<span class="pill ${s[1]}">${s[0]}</span>`];
  if (m.auto) pills.push(`<span class="pill f">Otomatik</span>`);
  if (m.scope) pills.push(`<span class="pill f">Dürbünlü</span>`);
  if (m.pellets) pills.push(`<span class="pill f">${m.pellets} saçma</span>`);
  let rows = stat("Fiyat", m.price ? "$" + m.price.toLocaleString("tr-TR") : "Ücretsiz", m.price / MAX.price);
  if (m.dmg){
    rows += stat(m.pellets ? "Hasar / saçma" : "Hasar", m.dmg, m.dmg / MAX.dmg);
    rows += stat("Atış hızı", m.rpm + " /dk", m.rpm / MAX.rpm);
    rows += stat("Şarjör", m.mag + " / " + m.res, m.mag / MAX.mag);
    rows += stat("Zırh delme", Math.round(m.pen * 100) + "%", m.pen);
  }
  if (m.kind === "KNIFE") rows += stat("Hasar", "tek vuruş");
  document.getElementById("card").innerHTML = `
    <div class="kind">${KIND_NAME[m.kind] || ""}</div>
    <h3>${m.name}</h3>
    <div class="pills">${pills.join("")}</div>
    <dl>${rows}</dl>
    <div class="meta"><span>Eşya: ${ITEM_TR[m.item] || m.item}</span><span>CustomModelData: ${m.cmd}</span><span>Model: pisanstrike:item/${m.model}</span><span>${m.boxes.length} küp</span></div>`;
}

/* ---------- sahne ---------- */
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 100);
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08; controls.minDistance = 0.4; controls.maxDistance = 6;
scene.add(new THREE.HemisphereLight(0xffffff, 0x445044, 0.75));
const sun = new THREE.DirectionalLight(0xffffff, 0.75); sun.position.set(2, 3, 2.5); scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 0.25); fill.position.set(-2, 1, -2); scene.add(fill);
let grid = null;
const pal = DATA.palette.map(c => new THREE.Color(c[0]/255, c[1]/255, c[2]/255));
const mats = pal.map(c => new THREE.MeshLambertMaterial({color:c}));
const edgeMat = new THREE.LineBasicMaterial({color:0x000000, transparent:true, opacity:0.35});
let modelGroup = null, edgesOn = true, spin = true, view = "free", current = null;

function css(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function applyTheme(){
  scene.background = new THREE.Color(css("--stage") || "#202521");
  if (grid) scene.remove(grid);
  const gc = new THREE.Color(css("--grid") || "#3a423c");
  grid = new THREE.GridHelper(2, 32, gc, gc); grid.position.y = -0.62; scene.add(grid);
}

function build(m){
  if (modelGroup) { scene.remove(modelGroup); modelGroup.traverse(o => { if (o.geometry) o.geometry.dispose(); }); }
  modelGroup = new THREE.Group();
  for (const b of m.boxes){
    const [fx,fy,fz,tx,ty,tz,ci,axis,angle,ox,oy,oz] = b;
    const w = Math.max(tx-fx, 0.001), h = Math.max(ty-fy, 0.001), d = Math.max(tz-fz, 0.001);
    const geo = new THREE.BoxGeometry(w/16, h/16, d/16);
    const mesh = new THREE.Mesh(geo, mats[ci]);
    const cx = (fx+tx)/2, cy = (fy+ty)/2, cz = (fz+tz)/2;
    let holder;
    if (axis){
      holder = new THREE.Group(); holder.position.set((ox-8)/16, (oy-8)/16, (oz-8)/16);
      holder.rotation[axis] = THREE.MathUtils.degToRad(angle);
      mesh.position.set((cx-ox)/16, (cy-oy)/16, (cz-oz)/16);
      holder.add(mesh);
    } else { holder = mesh; mesh.position.set((cx-8)/16, (cy-8)/16, (cz-8)/16); }
    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo), edgeMat);
    edges.visible = edgesOn; edges.userData.edge = true; mesh.add(edges);
    modelGroup.add(holder);
  }
  scene.add(modelGroup);
  const box = new THREE.Box3().setFromObject(modelGroup);
  const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
  modelGroup.position.sub(center);
  modelGroup.userData.radius = Math.max(size.x, size.y, size.z);
  if (grid) grid.position.y = -size.y/2 - 0.04;
  setView(view, true);
}

function setView(v, keep){
  view = v;
  for (const [id, name] of [["v-free","free"],["v-side","side"],["v-fp","fp"]]) document.getElementById(id).setAttribute("aria-pressed", String(v === name));
  const r = (modelGroup && modelGroup.userData.radius) || 1;
  const d = r * 2.1 + 0.25;
  controls.target.set(0, 0, 0);
  if (v === "side"){ camera.position.set(0, 0, d); }
  else if (v === "fp"){ camera.position.set(-r*1.05, r*0.3, r*0.32); controls.target.set(r*0.35, 0, 0); }
  else { camera.position.set(d*0.55, d*0.35, d*0.8); }
  if (modelGroup) modelGroup.rotation.set(0, 0, 0);
  controls.update();
  document.getElementById("hint").textContent = v === "fp" ? "Dipçiğin arkasından, namlu boyunca" : v === "side" ? "Envanterdeki gibi yandan" : "";
}

function select(id){
  const m = byId[id] || DATA.models.find(x => x.id === "ak47") || DATA.models[0];
  current = m.id;
  build(m); renderCard(m);
  document.querySelectorAll(".item").forEach(b => b.setAttribute("aria-current", String(b.dataset.id === current)));
}

document.getElementById("v-free").onclick = () => setView("free");
document.getElementById("v-side").onclick = () => setView("side");
document.getElementById("v-fp").onclick = () => setView("fp");
document.getElementById("t-spin").onclick = e => { spin = !spin; e.currentTarget.setAttribute("aria-pressed", String(spin)); };
document.getElementById("t-edge").onclick = e => { edgesOn = !edgesOn; e.currentTarget.setAttribute("aria-pressed", String(edgesOn));
  modelGroup && modelGroup.traverse(o => { if (o.userData.edge) o.visible = edgesOn; }); };
controls.addEventListener("start", () => { if (spin){ spin = false; document.getElementById("t-spin").setAttribute("aria-pressed","false"); } });

function resize(){
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== Math.floor(w * renderer.getPixelRatio()) || canvas.height !== Math.floor(h * renderer.getPixelRatio())){
    renderer.setSize(w, h, false); camera.aspect = w / Math.max(h, 1); camera.updateProjectionMatrix();
  }
}
const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
if (reduce) { spin = false; document.getElementById("t-spin").setAttribute("aria-pressed","false"); }
let last = performance.now();
function loop(t){
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  resize();
  if (spin && modelGroup && view === "free") modelGroup.rotation.y += dt * 0.5;
  controls.update(); renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
const mq = window.matchMedia("(prefers-color-scheme: dark)");
mq.addEventListener && mq.addEventListener("change", applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement, {attributes:true, attributeFilter:["data-theme"]});
window.addEventListener("hashchange", () => select(location.hash.slice(1)));

applyTheme();
current = location.hash.slice(1) || "ak47";
renderList("");
select(current);
requestAnimationFrame(loop);
</script>
