# ==============================
#  PisanCore - Pisanskyblock
# ==============================

economy:
  currency-singular: "Coin"
  currency-plural: "Coin"
  starting-balance: 500.0

# Yeni oyuncuya verilecek baslangic anahtarlari
starter-keys:
  enabled: true
  keys:
    caylak: 3

# Tas jeneratoru: lav + su ile olusan tas/kirik tas kirilinca calisir.
# Oyuncunun koydugu tas sayilmaz (istismar onlemi).
generator:
  enabled: true
  # Sadece bu dunyalarda calisir (bos = her yerde)
  worlds: []
  blocks: [COBBLESTONE, STONE, BASALT]
  # Lav+su ile blok olusurken TEK zar: kirik tas yerine bu cevher BLOGU olusur. Sans yuzde (%).
  ores:
    coal:           { chance: 6.00, block: COAL_ORE }
    copper:         { chance: 4.00, block: COPPER_ORE }
    iron:           { chance: 3.00, block: IRON_ORE }
    lapis:          { chance: 1.50, block: LAPIS_ORE }
    redstone:       { chance: 1.50, block: REDSTONE_ORE }
    gold:           { chance: 1.00, block: GOLD_ORE }
    diamond:        { chance: 0.50, block: DIAMOND_ORE }
    emerald:        { chance: 0.30, block: EMERALD_ORE }
    ancient_debris: { chance: 0.03, block: ANCIENT_DEBRIS }
  # Kirik tas kazmayla kirilinca AYRI zar: anahtar cikarsa tas dusmez, yerine anahtar duser. Sans yuzde (%).
  # broadcast: true ise tum sunucuya duyurulur.
  keys:
    caylak:  { chance: 0.500, name: "&aÇaylak Anahtarı",    broadcast: false }
    tasci:   { chance: 0.300, name: "&7Taşçı Anahtarı",     broadcast: false }
    madenci: { chance: 0.180, name: "&eMadenci Anahtarı",   broadcast: false }
    demirci: { chance: 0.100, name: "&fDemirci Anahtarı",   broadcast: false }
    kasif:   { chance: 0.060, name: "&bKaşif Anahtarı",     broadcast: true }
    sovalye: { chance: 0.035, name: "&9Şövalye Anahtarı",   broadcast: true }
    usta:    { chance: 0.020, name: "&5Usta Anahtarı",      broadcast: true }
    ejder:   { chance: 0.010, name: "&4Ejder Anahtarı",     broadcast: true }
    efsane:  { chance: 0.004, name: "&6Efsane Anahtarı",    broadcast: true }
    kozmik:  { chance: 0.001, name: "&d&lKozmik Anahtar",   broadcast: true }

# Jenerator disi anahtar kaynaklari. Sans = jenerator anahtar sansi x carpan.
key-sources:
  mobs: 1.5          # dusman yaratik oldurme
  spawner-mobs: 0.25 # spawner'dan cikan yaratiklar icin ek carpan (1.5 x 0.25)
  crops: 0.4         # olgun ekin / kavun / balkabagi hasadi
  minions: 0.5       # minyonlar: uretim basina (kazici: kirdigi her tas icin)

# Minyonlar: adaya konur, chunk yukluyken urun uretir. /minyon = market
minions:
  max-per-player: 8
  # Seviye 1..5: uretim suresi carpani ve depo kapasitesi
  tier-speed:   [1.0, 0.85, 0.72, 0.6, 0.5]
  tier-storage: [128, 256, 448, 640, 960]
  # Yukseltme fiyati = minyon fiyati x carpan (1->2, 2->3, 3->4, 4->5)
  tier-upgrade-cost: [1.0, 2.0, 4.0, 8.0]
  types:
    tas:      { name: "&7Taş Minyonu",       head: COBBLESTONE,    output: COBBLESTONE,  amount: 1, interval: 12, price: 750,   color: "8a8a8a", tool: WOODEN_PICKAXE }
    odun:     { name: "&6Odun Minyonu",      head: OAK_LOG,        output: OAK_LOG,      amount: 1, interval: 20, price: 1500,  color: "8b5a2b", tool: STONE_AXE }
    bugday:   { name: "&eBuğday Minyonu",    head: HAY_BLOCK,      output: WHEAT,        amount: 1, interval: 16, price: 1500,  color: "e6c84a", tool: WOODEN_HOE }
    seker:    { name: "&aŞeker Kamışı Minyonu", head: SUGAR_CANE,  output: SUGAR_CANE,   amount: 1, interval: 18, price: 2000,  color: "6fcf4a", tool: WOODEN_HOE }
    komur:    { name: "&8Kömür Minyonu",     head: COAL_BLOCK,     output: COAL,         amount: 1, interval: 30, price: 5000,  color: "2b2b2b", tool: STONE_PICKAXE }
    demir:    { name: "&fDemir Minyonu",     head: IRON_BLOCK,     output: IRON_INGOT,   amount: 1, interval: 36, price: 8000,  color: "d8d8d8", tool: STONE_PICKAXE }
    lapis:    { name: "&9Lapis Minyonu",     head: LAPIS_BLOCK,    output: LAPIS_LAZULI, amount: 3, interval: 40, price: 8000,  color: "2546b3", tool: IRON_PICKAXE }
    redstone: { name: "&cRedstone Minyonu",  head: REDSTONE_BLOCK, output: REDSTONE,     amount: 3, interval: 40, price: 8000,  color: "b52020", tool: IRON_PICKAXE }
    altin:    { name: "&6Altın Minyonu",     head: GOLD_BLOCK,     output: GOLD_INGOT,   amount: 1, interval: 48, price: 12000, color: "f2c230", tool: IRON_PICKAXE }
    # mode: break -> yanindaki jenerator blogunu (tas/cevher) kazar
    kazici:   { name: "&3Kazıcı Minyon",     head: OBSERVER,       output: COBBLESTONE,  amount: 1, interval: 5,  price: 15000, color: "2f6f8f", tool: DIAMOND_PICKAXE, mode: break }
    elmas:    { name: "&bElmas Minyonu",     head: DIAMOND_BLOCK,  output: DIAMOND,      amount: 1, interval: 90, price: 50000, color: "4ee6e0", tool: DIAMOND_PICKAXE }

messages:
  prefix: "&6&lPISAN &8» &7"
  ore-drop: "&a+ %amount%x %item%"
  key-drop: "&eŞanslı gün! &f%key% &edüştü!"
  key-broadcast: "&6%player% &etaş kırarken &f%key% &ebuldu!"
