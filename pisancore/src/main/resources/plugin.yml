name: PisanCore
version: ${project.version}
main: com.pisan.core.PisanCore
api-version: '1.21'
author: Pisan
description: Pisan Skyblock/SMP - coin ekonomisi, tas jeneratoru odulleri, kasa anahtarlari, SMP dunyasi
depend: [Vault]
loadbefore: [EconomyShopGUI, BentoBox]
commands:
  bal:
    aliases: [balance, para, coin, money]
    description: Coin bakiyeni gosterir
  pay:
    aliases: [ode, gonder]
    description: Baska oyuncuya coin gonderir
  baltop:
    aliases: [zenginler]
    description: En zengin oyuncular
  eco:
    description: Admin ekonomi komutu
    permission: pisancore.admin
  kasa:
    aliases: [kasalar, crate, crates, anahtarlar]
    description: Kasa menusu
  duel:
    aliases: [duello, 1v1]
    description: Esyali duel
  takas:
    aliases: [trade, ticaret]
    description: Oyuncu takasi
  minyon:
    aliases: [minyonlar, minion, minions]
    description: Minyon marketi
  skill:
    aliases: [skiller, skills, yetenek]
    description: Skill menusu
  scoreboard:
    aliases: [sb]
    description: Scoreboard ac/kapat
  siralama:
    aliases: [sıralama, top, sira]
    description: Para / ada / skill siralamasi
  arkadas:
    aliases: [arkadaş, arkadaslar, friend, friends, f]
    description: Arkadas sistemi
  lobi:
    aliases: [lobby, spawn]
    description: Bulundugun modun lobisine isinlan
  menu:
    aliases: [hub, sec, secim, modsec, mod, sunucular]
    description: Mod secimi (Skyblock / SMP)
  skylobi:
    aliases: [skylobby, sky, skyblock]
    description: Skyblock lobisine isinlan
  smplobi:
    aliases: [smplobby]
    description: SMP lobisine isinlan
  smp:
    aliases: [survival]
    description: SMP dunyasina gir (kaldigin yer)
  market:
    aliases: [satinal, al, buy]
    description: Esyanin satin alma ekranini ac
  event:
    aliases: [etkinlik, events]
    description: Sunucu etkinlikleri
  sat:
    aliases: [sell, satis]
    description: Satis penceresi (/sat el, /sat fiyat)
  ah:
    aliases: [pazar, auction, auctionhouse, ihale]
    description: Oyuncu pazari (Skyblock ve SMP ayri)
  pisancore:
    description: Admin komutu (reload)
    permission: pisancore.admin
permissions:
  pisancore.admin:
    default: op
