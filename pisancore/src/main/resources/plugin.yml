name: PisanCore
version: ${project.version}
main: com.pisan.core.PisanCore
api-version: '1.21'
author: Pisan
description: Pisanskyblock - coin ekonomisi, tas jeneratoru odulleri, kasa anahtarlari
depend: [Vault]
loadbefore: [AuctionHouse, EconomyShopGUI, BentoBox]
commands:
  bal:
    aliases: [balance, para, coin, money]
    description: Coin bakiyeni gosterir
  pay:
    aliases: [ode, gonder]
    description: Baska oyuncuya coin gonderir
  baltop:
    aliases: [zenginler]
    description: En zengin oyuncular
  eco:
    description: Admin ekonomi komutu
    permission: pisancore.admin
  kasa:
    aliases: [kasalar, crate, crates, anahtarlar]
    description: Kasa menusu
  duel:
    aliases: [duello, 1v1]
    description: Esyali duel
  takas:
    aliases: [trade, ticaret]
    description: Oyuncu takasi
  minyon:
    aliases: [minyonlar, minion, minions]
    description: Minyon marketi
  skill:
    aliases: [skiller, skills, yetenek]
    description: Skill menusu
  scoreboard:
    aliases: [sb]
    description: Scoreboard ac/kapat
  siralama:
    aliases: [sıralama, top, sira]
    description: Para / ada / skill siralamasi
  arkadas:
    aliases: [arkadaş, arkadaslar, friend, friends, f]
    description: Arkadas sistemi
  lobi:
    aliases: [lobby, spawn, hub]
    description: Lobiye isinlan
  market:
    aliases: [satinal, al, buy]
    description: Esyanin satin alma ekranini ac
  pisancore:
    description: Admin komutu (reload)
    permission: pisancore.admin
permissions:
  pisancore.admin:
    default: op
